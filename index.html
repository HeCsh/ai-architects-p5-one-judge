<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer Judges</title>
  <meta name="description" content="Type a soccer opinion and an AI judge scores it out of ten">
  <meta name="theme-color" content="#38bdf8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .font-display {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-8">
      <a href="#" class="flex items-center gap-2.5 text-slate-900 shrink-0">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white shadow-sm shadow-sky-500/20 font-display font-extrabold">10</span>
        <span class="font-display font-bold text-xl tracking-tight text-slate-900 whitespace-nowrap" id="brand-title">Soccer Judges</span>
      </a>
    </div>
  </header>

  <section class="bg-gradient-to-b from-sky-100/70 via-indigo-50/40 to-slate-50 border-b border-slate-200/80 pt-10 pb-8 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto">
      <div class="inline-flex items-center gap-2 text-xs font-bold text-sky-700 uppercase tracking-wider mb-2">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        <span>The judge is in</span>
      </div>
      <h1 id="topic" class="font-display text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight">
        Soccer Judges
      </h1>
      <p class="mt-3 text-slate-600 text-sm sm:text-base leading-relaxed max-w-2xl">
        Got a hot take about a player, a team or a tactic? Type it in. The judge scores it out of ten and tells you why.
      </p>

      <!-- The box. What gets typed here is sent to the server, never
           straight to the AI, because only the server has the key. -->
      <div class="mt-8 bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-sm">
        <label for="submission" class="block text-sm font-bold text-slate-800 mb-2">
          Send in <span id="submission-label">an opinion about soccer</span>
        </label>
        <textarea id="submission" rows="4"
          placeholder="Palmer should start ahead of Foden, because..."
          class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm sm:text-base text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all"></textarea>
        <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <p class="text-xs text-slate-500">Give a reason or two. The judge likes reasons.</p>
          <button id="send" type="button"
            class="px-5 py-2.5 rounded-xl text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 disabled:opacity-60 disabled:cursor-wait shadow-sm transition-all whitespace-nowrap">
            Ask the judge
          </button>
        </div>
      </div>
    </div>
  </section>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">

    <!-- The judge's card. Hidden until there is a score to show. -->
    <article id="result" class="hidden bg-white rounded-2xl p-6 border border-slate-200/90 shadow-sm">
      <div class="flex items-start justify-between gap-6">
        <div>
          <h2 id="judge-name" class="font-display text-xl font-bold text-slate-900"></h2>
          <p id="judge-character" class="mt-1 text-xs text-slate-500 leading-relaxed"></p>
        </div>
        <div class="text-right shrink-0">
          <div class="font-display text-5xl font-extrabold text-sky-600 tabular-nums leading-none"><span id="score"></span><span class="text-xl text-slate-400">/10</span></div>
        </div>
      </div>
      <p id="reason" class="mt-4 pt-4 border-t border-slate-100 text-slate-700 text-sm sm:text-base leading-relaxed"></p>
    </article>

    <!-- Thinking. AI answers take a few seconds, and a page that does
         nothing for that long looks broken. -->
    <div id="thinking" class="hidden bg-white rounded-2xl p-6 border border-slate-200 shadow-sm animate-pulse flex flex-col gap-4">
      <div class="h-5 bg-slate-200 rounded w-1/3"></div>
      <div class="h-4 bg-slate-100 rounded w-full"></div>
      <div class="h-4 bg-slate-100 rounded w-5/6"></div>
    </div>

    <div id="error-container" class="hidden p-6 bg-amber-50 border border-amber-200 rounded-2xl text-center max-w-lg mx-auto">
      <h3 class="text-base font-bold text-slate-800">The judge could not answer</h3>
      <p id="error-message" class="text-sm text-slate-600 mt-1"></p>
    </div>

  </main>

  <footer class="bg-white border-t border-slate-200 mt-12 py-8 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto text-xs text-slate-500">
      Soccer Judges · An AI Architects project
    </div>
  </footer>

  <script>
    const box = document.getElementById('submission');
    const sendBtn = document.getElementById('send');
    const resultEl = document.getElementById('result');
    const thinkingEl = document.getElementById('thinking');
    const errorEl = document.getElementById('error-container');
    const errorMessage = document.getElementById('error-message');

    function show(which) {
      for (const el of [resultEl, thinkingEl, errorEl]) el.classList.add('hidden');
      if (which) which.classList.remove('hidden');
    }

    function showError(message) {
      errorMessage.textContent = message;
      show(errorEl);
    }

    // The topic name and what gets submitted come from config.json, so they
    // match whatever the judge has been told.
    fetch('./config.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((config) => {
        document.getElementById('submission-label').textContent = config.submission;
      })
      .catch(() => { /* the page still works with the words already on it */ });

    async function askTheJudge() {
      const submission = box.value.trim();
      if (!submission) {
        showError('Type something in the box first.');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'The judge is thinking...';
      show(thinkingEl);

      try {
        const res = await fetch('./api/judge', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ submission }),
        });
        // A page opened straight from a file, or from GitHub Pages, has no
        // server behind it. Say that plainly rather than showing an error code.
        if (res.status === 404 || res.status === 405) {
          throw new Error('There is no server running behind this page, so there is nobody to ask. Start it with the command in the README.');
        }
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');

        // textContent, not innerHTML: whatever the AI writes is shown as
        // words, and can never be run as code on the page.
        document.getElementById('judge-name').textContent = data.judge;
        document.getElementById('judge-character').textContent = data.character;
        document.getElementById('score').textContent = data.score;
        document.getElementById('reason').textContent = data.reason;
        show(resultEl);
      } catch (err) {
        const offline = err instanceof TypeError; // fetch could not reach anything at all
        showError(offline
          ? 'There is no server running behind this page, so there is nobody to ask. Start it with the command in the README.'
          : err.message);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Ask the judge';
      }
    }

    sendBtn.addEventListener('click', askTheJudge);
    // Ctrl+Enter (or Cmd+Enter on a Mac) sends it, so a fast typer never has
    // to reach for the mouse. A plain Enter still makes a new line.
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) askTheJudge();
    });
  </script>
</body>
</html>
